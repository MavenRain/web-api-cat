[package]
name = "web-api-cat"
version = "0.7.5"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.5 extends the v0.7.4 event system with spec-compliant event flow: `dispatchEvent` decorates the supplied event with `target` / `currentTarget` / `defaultPrevented` plus `preventDefault()` / `stopPropagation()` / `stopImmediatePropagation()` methods.  Listeners interact with the dispatch as they would in a real browser without needing a `new Event()` constructor.  `dispatchEvent` returns `false` when any listener called `preventDefault`.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.1"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
