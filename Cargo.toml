[package]
name = "web-api-cat"
version = "0.6.8"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.6.8 lands parent-backref infrastructure: every element gets a hidden `__parent__` slot (Object when attached, Null when detached or root), every structural mutator (`appendChild` / `removeChild` / `insertBefore` / `replaceChild` / `innerHTML` setter / `cloneNode` deep-children) routes through shared `set_parent_backref` / `clear_parent_backref` helpers, and `parentElement` / `parentNode` accessor-getters plus `Element.remove()` ride on top.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7"
html-cat = "0.1"
net-cat = "0.1"
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
