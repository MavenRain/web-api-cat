[package]
name = "web-api-cat"
version = "0.7.11"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.11 adds `querySelectorAll(selector)` on both `Element` and `document`.  Walks every descendant in depth-first pre-order and returns ALL matches as a NodeList-shaped Object (numeric-key entries + `length`, same shape as `Element.children` so script-side `list[i]` / `list.length` iteration patterns work uniformly).  Same selector grammar as v0.7.8 (`tag` / `.class` / `#id` / `[attr...]` / `*` / descendant + child combinators / comma-separated lists).  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
