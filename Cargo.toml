[package]
name = "web-api-cat"
version = "0.6.3"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.6.3 adds `Element.classList` as a `DOMTokenList`-shaped object exposing `add(token)`, `remove(token)`, `contains(token)`, and `toggle(token)`.  All writebacks flow through the existing `setAttribute('class', ...)` mirror path so `className`, `getAttribute('class')`, and `__attributes.class` stay in sync.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7"
html-cat = "0.1"
net-cat = "0.1"
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
