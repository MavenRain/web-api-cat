[package]
name = "web-api-cat"
version = "0.7.9"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.9 ships `new Event(type, options)` and `new CustomEvent(type, options)` constructors as global bindings (and the legacy bare-call forms, since boa-cat 0.7.2's NativeFn-as-constructor path supports both).  Dispatch now decorates the user's event Object in place rather than creating a fresh copy, so post-dispatch reads of `defaultPrevented` / `target` / `currentTarget` on the caller's reference reflect what happened during the bubble walk.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
