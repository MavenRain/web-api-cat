[package]
name = "web-api-cat"
version = "0.6.1"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.6.1 opens DOM mutation: `document.createElement(tag)` allocates a fresh element-shaped Object with the requested tagName and empty fields; `Element.appendChild(child)` mutates the children array in-place and returns the appended child.  Both compose with the existing `extract_document` back-prop so newly-created and newly-appended nodes reach layout / paint on the next eval pass.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7"
html-cat = "0.1"
net-cat = "0.1"
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
