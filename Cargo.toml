[package]
name = "web-api-cat"
version = "0.7.22"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.22 wires the Location API: `window.location` (also bound as global `location`) exposes `href` (read-write), `protocol` / `host` / `hostname` / `port` / `pathname` / `search` / `hash` / `origin` (read-only, parsed from href via the `url` crate), and methods `assign(url)` / `replace(url)` / `reload()` / `toString()`.  Setters and methods record a NavigationIntent enum to a hidden slot that downstream consumers read via `location::read_pending_navigation(&env, &heap)` and clear with `clear_pending_navigation`.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"
url = "2"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
