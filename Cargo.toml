[package]
name = "web-api-cat"
version = "0.6.0"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.6.0 bumps to boa-cat 0.7 + ecma-parse-cat 0.3 so the v0.4 `document.cookie` accessor pair and the v0.5 `Value::Promise(_)` arms compose with user-supplied scripts using natural async syntax (`async () => body`, `async function foo() { ... }`, and reserved-word member access like `obj.catch(cb)`).  No source change.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7"
html-cat = "0.1"
net-cat = "0.1"
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
