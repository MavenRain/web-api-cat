[package]
name = "web-api-cat"
version = "0.7.21"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.21 surfaces three element-walking helpers downstream consumers (e.g. tauri-runtime-servocat populating decoded `<img>` metadata) need to enumerate heap-side DOM elements without going through the JS engine: `read_attribute(&Value::Object(id), name, &heap)` is now `pub` (was `pub(crate)`), and two new helpers in `element` -- `document_root_object_id(&env, &heap)` and `find_all_in_document(&env, selector, &heap)` -- locate the document root via `env.lookup(\"document\")` and run the v0.7.17 subtree-walker (include root + descendants).  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
