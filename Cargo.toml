[package]
name = "web-api-cat"
version = "0.7.3"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.3 unlocks HTTPS in `fetch`: bumps net-cat from 0.1 to 0.3 with the `tls` feature enabled (rustls + webpki-roots + ring as the pure-Rust crypto provider, no C toolchain).  `https://` URLs now flow through the same code path as `http://`, and net-cat 0.3's chunked-transfer decoding + cross-origin redirect Cookie/Authorization stripping come along for the ride.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
