[package]
name = "web-api-cat"
version = "0.7.20"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.20 wires the `<img>` element to scripts: `src` / `alt` / `width` / `height` accessor-pair properties reflect the corresponding HTML attributes, and `naturalWidth` / `naturalHeight` / `complete` read hidden state slots populated by downstream consumers after the fetch + decode pipeline runs.  Public helpers `image::set_natural_size(&img, w, h, heap)` and `image::set_complete(&img, b, heap)` let the runtime (tauri-runtime-servocat) push the decoded state back through to JS.  Opens the image-rendering story for the pending Tauri opt-in backend pitch.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
