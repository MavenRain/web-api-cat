[package]
name = "web-api-cat"
version = "0.7.1"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.1 upgrades `fetch(url)` to return a `Promise<Response>` matching the DOM Fetch API shape: success becomes a resolved Promise carrying the response Object; bad URL / argument errors become a rejected Promise with a `TypeError:`-prefixed string reason; `response.text()` returns a resolved `Promise<string>` of the body; `response.json()` is a rejected-stub deferring to `JSON.parse(await r.text())` (ecma-runtime-cat already exposes JSON.parse).  Scripts now use `await fetch(url)` and `fetch(url).then(r => r.text())` end-to-end through the engine's microtask driver.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7"
html-cat = "0.1"
net-cat = "0.1"
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
