[package]
name = "web-api-cat"
version = "0.6.2"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.6.2 rounds out structural DOM mutation: `Element.removeChild(child)` drops `child` from `this.children` and shifts the survivors down; `Element.insertBefore(newNode, referenceNode)` inserts before the reference slot (or appends when `referenceNode` is `null`), shifting subsequent children up.  All three mutation methods (`appendChild` from v0.6.1 plus these two) share the new `children_object_of` helper and compose with `extract_document` so the post-mutation tree reaches layout / paint on the next eval pass.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7"
html-cat = "0.1"
net-cat = "0.1"
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
