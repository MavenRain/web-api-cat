[package]
name = "web-api-cat"
version = "0.7.12"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.12 extends the v0.7.8 selector grammar with sibling combinators: `a + b` (adjacent sibling -- b's immediately-preceding sibling matches a) and `a ~ b` (general sibling -- any of b's preceding siblings matches a).  Both walk the parent's children array via the existing `__parent__` backref to compute sibling relationships.  Combines with all existing combinators (`section h2 + p`, etc.) and reaches scripts through both `querySelector` and `querySelectorAll`.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
