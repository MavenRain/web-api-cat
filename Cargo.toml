[package]
name = "web-api-cat"
version = "0.6.4"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.6.4 adds `Element.style` as a fresh empty Object on each element, so common script patterns like `el.style.color = 'red'` and `el.style.display = 'none'` round-trip through the engine's normal property storage without throwing.  Inline `style=\"...\"` attribute parsing and back-prop into layout-cat are deferred; the goal here is script compatibility.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7"
html-cat = "0.1"
net-cat = "0.1"
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
