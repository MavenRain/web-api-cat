[package]
name = "web-api-cat"
version = "0.7.8"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.8 extends `querySelector` from the v0.6.x five-pattern subset to a real CSS selector grammar covering most real-world script usage: comma-separated selector lists; `tag` / `.class` (multiple per compound) / `#id` / `[attr]` / `[attr=val]` / `[attr^=val]` / `[attr$=val]` / `[attr*=val]` / `*`; whitespace (descendant) and `>` (child) combinators.  Reverse-walks the candidate's ancestor chain via the v0.6.8 `__parent__` backref for combinator matching.  Sibling combinators (`+`, `~`) and pseudo-classes deferred.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
