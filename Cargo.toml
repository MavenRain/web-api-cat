[package]
name = "web-api-cat"
version = "0.7.13"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.13 adds `Element.matches(selector)` (predicate against `this`), `Element.closest(selector)` (walks ancestor chain inclusive of self, returns nearest match or null), and three pseudo-classes (`:first-child`, `:last-child`, `:only-child`) reachable through `querySelector` / `querySelectorAll` / `matches` / `closest` -- all reusing the v0.7.8-12 selector machinery.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
