[package]
name = "web-api-cat"
version = "0.7.17"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.17 adds the `:empty` and `:root` structural pseudo-classes plus a semantic fix: `document.querySelector` / `querySelectorAll` / `getElementsByTagName` / `getElementsByClassName` now search the document root AND its descendants (matching browser spec), so `document.querySelector('html')` and `document.querySelector(':root')` both resolve correctly.  Element APIs still walk descendants only.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
