[package]
name = "web-api-cat"
version = "0.7.10"
edition = "2024"
description = "Bindings between boa-cat (JS engine) and the DOM (html-cat tree) plus fetch (net-cat).  v0.7.10 honours the spec's `cancelable` gate on `preventDefault()`: the method now only flips `defaultPrevented` when `this.cancelable === true`.  Default-constructed events (plain `{type: 'foo'}` literals, or `new Event(type)` without explicit options) are NOT cancelable and `preventDefault` is a silent no-op on them; scripts must opt in via `new Event(type, { cancelable: true })` or `{ type, cancelable: true }`.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["dom", "fetch", "javascript", "boa", "type-driven"]
categories = ["web-programming"]

[dependencies]
boa-cat = "0.7.2"
html-cat = "0.1"
net-cat = { version = "0.3", features = ["tls"] }
dom-cat = "0.1"

[dev-dependencies]
proptest = "1"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
